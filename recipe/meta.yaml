{% set name = "elasticsearch" %}
{% set version = "9.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/elastic/{{ name }}-py/archive/refs/tags/v{{ version }}.tar.gz
  sha256: e2e6a5d609e1b07c739dab907c4d10eb0eae8ca4476333217232045cb9550f08

build:
  skip: true  # [py<310]
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv

requirements:
  host:
    - python
    - pip
    - hatchling
  run:
    - python
    - elastic-transport >=9.2.0,<10
    - python-dateutil
    - typing_extensions
    - sniffio
    - anyio
  run_constrained:
    - aiohttp >=3,<4
    - requests >=2.4.0,!=2.32.2,<3.0.0
    - orjson >=3
    - pyarrow >=1
    - numpy >=1
    - simsimd >=3

test:
  source_files:
    - test_elasticsearch
  imports:
    - elasticsearch
    - elasticsearch.client
    - elasticsearch.compat
  requires:
    - pip
    - pytest
    - pytz
    - requests
    - pydantic
    - pyyaml
    - orjson
    - trio
    - pytest-asyncio
    - aiohttp
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -v test_elasticsearch

about:
  home: https://github.com/elastic/elasticsearch-py
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  description: |
    Official low-level client for Elasticsearch. Its goal is to provide common ground for all Elasticsearch-related code in Python; because of this it tries to be opinion-free and very extendable.
  summary: Python client for Elasticsearch
  doc_url: https://elasticsearch-py.readthedocs.io
  dev_url: https://github.com/elastic/elasticsearch-py

extra:
  recipe-maintainers:
    - ahlaw
    - sethmlarson
